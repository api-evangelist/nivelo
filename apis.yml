aid: nivelo
name: Nivelo
description: >-
  Nivelo is a New York City fintech that operates a payments risk and money-movement
  platform for the payroll industry, serving payment service providers (PSPs) and
  professional employer organizations (PEOs). Nivelo provides real-time payment risk
  intelligence and automated money movement across ACH, Wires, RTP, and FedNow rails,
  with capabilities including NSF (non-sufficient funds) prevention, ACH returns
  management, KYB and fraud monitoring, and treasury management. Its products include
  Exposure Scan (payment-risk identification), the Scorer Engine (a real-time ACH
  return-risk scoring API that predicts the likelihood of an ACH transaction failing
  before origination), and Instant Payroll (instant debits with auto-routing across
  payment rails to reduce failed payroll disbursements). Nivelo was founded in 2020 by
  Eli Polanco and Philippe Legault and raised a $2.5M seed round led by FirstMark,
  Barclays, and Anthemis.
