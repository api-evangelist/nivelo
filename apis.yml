apis:
- name: Nivelo Scorer API
  description: >-
    Nivelo's real-time ACH return-risk scoring API. A RESTful endpoint that accepts
    ACH transaction data as JSON and returns a risk score and a prediction of the
    likelihood of an ACH return, so originators, third-party senders, and banking
    payment providers can assess payment risk before origination. Authenticated with
    a Bearer API key; a test environment is available.
